services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: khayaos
      POSTGRES_USER: khayaos
      POSTGRES_PASSWORD: khayaos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: khayaos
      DB_USERNAME: khayaos
      DB_PASSWORD: khayaos
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - postgres
      - redis
    volumes:
      - ../backend:/var/www/html

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_TENANT_SLUG: pilot
    depends_on:
      - backend

  reverb:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: khayaos
      DB_USERNAME: khayaos
      DB_PASSWORD: khayaos
      REVERB_APP_ID: khayaos
      REVERB_APP_KEY: khayaos-local-key
      REVERB_APP_SECRET: khayaos-local-secret
    depends_on:
      - backend

volumes:
  postgres_data:
